              <script>
                (function () {
                  // Redirect-based Google sign-in (Authorization Code flow).
                  // No popups: works in Brave and with popup blockers.
                  function startGoogleSignIn() {
                    var btn = document.getElementById("google-signin-btn");
                    if (btn) btn.disabled = true;
                    window.location.href = "/auth/oidc/login";
                  }

                  // The backend callback redirects here with the FastSpec JWT
                  // (or an error) in the URL fragment: /log-in#token=… | #error=…
                  async function handleCallbackFragment() {
                    var hash = window.location.hash.replace(/^#/, "");
                    if (!hash) return;
                    var params = new URLSearchParams(hash);
                    var token = params.get("token");
                    var error = params.get("error");

                    // Remove the fragment so the token never sits in the URL bar
                    // or browser history.
                    history.replaceState(null, "", window.location.pathname);

                    if (error) {
                      alert("Sign-in failed: " + error);
                      return;
                    }
                    if (!token) return;

                    try {
                      localStorage.setItem("token", token);

                      // Fetch user info and store it
                      var userRes = await fetch("/auth/me", {
                        headers: { Authorization: "Bearer " + token },
                      });
                      if (userRes.ok) {
                        var user = await userRes.json();
                        localStorage.setItem("user", JSON.stringify(user));
                      }

                      window.location.replace("/specs/");
                    } catch (e) {
                      console.error("Google sign-in failed:", e);
                      alert("Sign-in failed: " + e.message);
                    }
                  }

                  var btn = document.getElementById("google-signin-btn");
                  if (btn) btn.addEventListener("click", startGoogleSignIn);

                  // Expose global for Webstudio React hydration (button onClick)
                  window.__startGoogleSignIn = startGoogleSignIn;

                  handleCallbackFragment();
                })();
              </script>
