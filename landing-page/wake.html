<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FastSpec — Waking up</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #0f0f0f;
        color: #f0f0f0;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .card {
        text-align: center;
        max-width: 420px;
        padding: 48px 32px;
      }
      h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 12px; }
      p  { color: #888; line-height: 1.6; margin-bottom: 32px; }
      button {
        background: #fff;
        color: #0f0f0f;
        border: none;
        padding: 14px 32px;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.2s;
      }
      button:disabled { opacity: 0.4; cursor: not-allowed; }
      .status {
        margin-top: 24px;
        font-size: 0.9rem;
        color: #888;
        min-height: 24px;
      }
      .spinner {
        display: none;
        width: 20px; height: 20px;
        border: 2px solid #333;
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 16px auto 0;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Environment is sleeping</h1>
      <p>FastSpec is offline to save costs when not in use.<br>Click below to wake it up — it takes about 2 minutes.</p>
      <button id="wakeBtn" onclick="wake()" style="display:none">Wake up</button>
      <div class="status" id="status"></div>
      <div class="spinner" id="spinner"></div>
    </div>

    <script>
      const WAKE_URL = '__WAKE_URL__';
      const SECRET   = '__WAKE_SECRET__';
      const HEALTH   = '/api/health';

      // On load, check if backend is already up — redirect immediately if so
      window.addEventListener('DOMContentLoaded', async () => {
        const status = document.getElementById('status');
        status.textContent = 'Checking environment status...';
        try {
          const res = await fetch(HEALTH, { cache: 'no-store' });
          if (res.ok) {
            status.textContent = 'Environment is already up! Redirecting...';
            setTimeout(() => { window.location.href = '/specs'; }, 800);
            return;
          }
        } catch {
          // not up — show the button
        }
        status.textContent = '';
        document.getElementById('wakeBtn').style.display = 'inline-block';
      });

      async function wake() {
        const btn     = document.getElementById('wakeBtn');
        const status  = document.getElementById('status');
        const spinner = document.getElementById('spinner');

        btn.disabled          = true;
        spinner.style.display = 'block';
        status.textContent    = 'Sending wake signal...';

        try {
          const res = await fetch(WAKE_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ secret: SECRET }),
          });

          if (res.status === 429) {
            // Already being woken up by someone else — just start polling
            status.textContent = 'Environment is already waking up — checking health...';
            poll();
            return;
          }

          if (res.status === 202) {
            // Within cooldown window — environment is already running or starting
            status.textContent = 'Environment is already waking up — checking health...';
            poll();
            return;
          }

          if (!res.ok) {
            status.textContent = 'Failed to trigger wake-up. Try again.';
            btn.disabled = false;
            spinner.style.display = 'none';
            return;
          }

          status.textContent = 'Environment waking up — checking health...';
          poll();
        } catch {
          status.textContent = 'Network error. Try again.';
          btn.disabled = false;
          spinner.style.display = 'none';
        }
      }

      async function poll() {
        const status = document.getElementById('status');
        const maxAttempts = 40; // ~4 min
        let attempt = 0;

        const interval = setInterval(async () => {
          attempt++;
          const remaining = Math.max(0, maxAttempts - attempt) * 6;
          status.textContent = `Waiting for backend... (~${remaining}s remaining)`;

          try {
            const res = await fetch(HEALTH, { cache: 'no-store' });
            if (res.ok) {
              clearInterval(interval);
              status.textContent = 'Environment is up! Redirecting...';
              setTimeout(() => { window.location.href = '/specs'; }, 1500);
            }
          } catch {
            // still starting, keep polling
          }

          if (attempt >= maxAttempts) {
            clearInterval(interval);
            status.textContent = 'Taking longer than expected. Try refreshing in a minute.';
          }
        }, 6000);
      }
    </script>
  </body>
</html>
