server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve assets under /specs/ using root-based mapping
    # Built files are placed in /usr/share/nginx/html/specs/
    location /specs/ {
        try_files $uri $uri/ /specs/index.html;
    }

    location = /specs {
        try_files $uri /specs/index.html;
    }

    # Handle /auth/callback for OAuth flow
    location /auth/callback {
        rewrite .* /specs/index.html break;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Disable caching for index.html
    location = /specs/index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
