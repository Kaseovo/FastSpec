# FastSpec with PostgreSQL — the recommended setup for teams.
#
#   docker compose up -d          → http://localhost:8080
#
# Configuration (sign-in, public URL, …) goes in a .env file next to this
# one — see .env.example. For a single-user install without Postgres, a
# plain `docker run` is enough (see README).

services:
  fastspec:
    image: ghcr.io/kaseovo/fastspec:${FASTSPEC_VERSION:-latest}
    build: .
    ports:
      # Only reachable from this machine. Put a reverse proxy with TLS in
      # front (and set PUBLIC_URL) before exposing it to a network.
      - "127.0.0.1:8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://fastspec:${POSTGRES_PASSWORD:-fastspec}@postgres:5432/fastspec
    volumes:
      # Generated JWT secret (and nothing else when using Postgres).
      - fastspec-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fastspec
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fastspec}
      POSTGRES_DB: fastspec
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fastspec -d fastspec"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  fastspec-data: {}
  postgres-data: {}
