services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fastspec-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend-data:/app
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - fastspec-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fastspec-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - fastspec-network
    restart: unless-stopped

networks:
  fastspec-network:
    driver: bridge

volumes:
  backend-data:
