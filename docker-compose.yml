services:
  traefik:
    container_name: fastspec-traefik-dev
    image: traefik:v3.6.12
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    restart: unless-stopped
    networks:
      - webnet

  backend:
    container_name: fastspec-backend-dev
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    labels:
      - "traefik.http.routers.backend.rule=PathPrefix(`/api`) || PathPrefix(`/auth`)"
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
    depends_on:
      - redis
    networks:
      - webnet

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - webnet

  frontend:
    container_name: fastspec-frontend-dev
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    labels:
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=5173"
    networks:
      - webnet

  mcp:
    container_name: fastspec-mcp-dev
    build:
      context: .
      dockerfile: backend/Dockerfile-MCP
    restart: unless-stopped
    env_file: .env
    depends_on:
      - redis
    ports:
      - "9000:9000"
    labels:
      - "traefik.http.routers.mcp.rule=PathPrefix(`/mcp`)"
      - "traefik.http.routers.mcp.entrypoints=web"
      - "traefik.http.routers.mcp.middlewares=mcp-stripprefix@docker"
      - "traefik.http.services.mcp.loadbalancer.server.port=9000"
      - "traefik.http.middlewares.mcp-stripprefix.stripprefix.prefixes=/mcp"
      - "traefik.http.routers.mcp.middlewares=mcp-stripprefix"
    networks:
      - webnet


networks:
  webnet: {}

volumes:
  redis-data: {}
