name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    # Blocks secrets in new commits — including generic ones GitHub push
    # protection doesn't recognise. Scans only what this push/PR adds.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            RANGE="$PR_BASE..HEAD"
          elif [ -n "$PUSH_BEFORE" ] && ! echo "$PUSH_BEFORE" | grep -q '^0*$'; then
            RANGE="$PUSH_BEFORE..HEAD"
          else
            RANGE="HEAD~1..HEAD"
          fi
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            git /repo --config /repo/.gitleaks.toml --log-opts="$RANGE" --redact --no-banner

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fastspec
          POSTGRES_PASSWORD: fastspec
          POSTGRES_DB: fastspec
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fastspec -d fastspec"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: ruff
        working-directory: backend
        run: ruff check .
      - name: pytest (SQLite + Postgres)
        working-directory: backend
        env:
          TEST_POSTGRES_URL: postgresql://fastspec:fastspec@localhost:5432/fastspec
        run: python -m pytest tests --tb=short
      - name: pytest (wake and auto-stop Lambdas)
        # Separate runs: both suites are tests/test_handler.py.
        run: |
          python -m pytest infra/lambda/wake/tests --tb=short
          python -m pytest infra/lambda/auto-stop/tests --tb=short

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - name: Jest + cdk synth
        working-directory: infra
        run: |
          npm ci
          npm test
          npx cdk synth --context env=local >/dev/null

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build self-hosted image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: fastspec:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (zero-config SQLite run)
        run: |
          docker run -d --name fastspec -p 8080:8080 fastspec:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health/ready && break
            sleep 1
          done
          curl -sf http://localhost:8080/health/ready
          curl -sf http://localhost:8080/specs/ | grep -q '<div id="app">'
          curl -sf -X POST http://localhost:8080/auth/local/session | grep -q access_token
      - name: Container logs
        if: failure()
        run: docker logs fastspec
