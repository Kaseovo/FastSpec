name: Auto-Stop

on:
  schedule:
    - cron: '*/30 * * * *'  # every 30 minutes
  workflow_dispatch: {}      # manual trigger for testing

jobs:
  auto-stop:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Check if environment is running
        id: check
        run: |
          STACK="FastSpec-Compute-prod"

          CLUSTER=$(aws cloudformation describe-stacks \
            --stack-name "$STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='ClusterName'].OutputValue" \
            --output text 2>/dev/null || echo "")

          if [ -z "$CLUSTER" ]; then
            echo "running=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          SERVICE=$(aws ecs list-services --cluster "$CLUSTER" \
            --query "serviceArns[0]" --output text | xargs basename)

          DESIRED=$(aws ecs describe-services \
            --cluster "$CLUSTER" \
            --services "$SERVICE" \
            --query "services[0].desiredCount" \
            --output text)

          if [ "$DESIRED" = "0" ]; then
            echo "running=false" >> $GITHUB_OUTPUT
          else
            echo "running=true" >> $GITHUB_OUTPUT
            echo "cluster=$CLUSTER" >> $GITHUB_OUTPUT
            echo "service=$SERVICE" >> $GITHUB_OUTPUT
          fi

      - name: Check ALB traffic in last 60 minutes
        id: traffic
        if: steps.check.outputs.running == 'true'
        run: |
          STACK="FastSpec-Compute-prod"

          ALB_ARN=$(aws cloudformation describe-stacks \
            --stack-name "$STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='AlbArn'].OutputValue" \
            --output text)

          # CloudWatch dimension needs the suffix of the ARN: app/name/id
          ALB_SUFFIX=$(echo "$ALB_ARN" | sed 's|.*:loadbalancer/||')

          END_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          START_TIME=$(date -u -d '60 minutes ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null \
            || date -u -v-60M +%Y-%m-%dT%H:%M:%SZ)  # macOS fallback

          REQUEST_COUNT=$(aws cloudwatch get-metric-statistics \
            --namespace AWS/ApplicationELB \
            --metric-name RequestCount \
            --dimensions Name=LoadBalancer,Value="$ALB_SUFFIX" \
            --start-time "$START_TIME" \
            --end-time "$END_TIME" \
            --period 3600 \
            --statistics Sum \
            --query "Datapoints[0].Sum" \
            --output text)

          echo "Request count in last 60 min: $REQUEST_COUNT"

          if [ "$REQUEST_COUNT" = "None" ] || [ "$REQUEST_COUNT" = "0.0" ] || [ -z "$REQUEST_COUNT" ]; then
            echo "idle=true" >> $GITHUB_OUTPUT
          else
            echo "idle=false" >> $GITHUB_OUTPUT
          fi

      - name: Stop idle environment
        if: steps.check.outputs.running == 'true' && steps.traffic.outputs.idle == 'true'
        run: |
          echo "No traffic in 60 minutes — stopping prod environment"

          # Stop Fargate
          aws ecs update-service \
            --cluster ${{ steps.check.outputs.cluster }} \
            --service ${{ steps.check.outputs.service }} \
            --desired-count 0

          # Stop RDS
          STACK="FastSpec-Data-prod"
          INSTANCE_ID=$(aws rds describe-db-instances \
            --query "DBInstances[?TagList[?Key=='aws:cloudformation:stack-name'&&Value=='$STACK']].DBInstanceIdentifier" \
            --output text)

          STATUS=$(aws rds describe-db-instances \
            --db-instance-identifier "$INSTANCE_ID" \
            --query "DBInstances[0].DBInstanceStatus" \
            --output text)

          if [ "$STATUS" = "available" ]; then
            aws rds stop-db-instance --db-instance-identifier "$INSTANCE_ID"
            echo "RDS stopped"
          fi

          echo "Prod environment stopped due to inactivity"

      - name: Environment still active
        if: steps.check.outputs.running == 'true' && steps.traffic.outputs.idle == 'false'
        run: echo "Traffic detected in last 60 min — keeping environment running"

      - name: Environment already stopped
        if: steps.check.outputs.running == 'false'
        run: echo "Prod environment is already stopped — nothing to do"
