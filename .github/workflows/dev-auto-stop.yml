name: Auto-Stop

on:
  schedule:
    - cron: '*/30 * * * *'  # every 30 minutes
  workflow_dispatch: {}      # manual trigger for testing

jobs:
  auto-stop:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Get Lambda function name
        id: check
        run: |
          STACK="FastSpec-Lambda-prod"

          FUNCTION=$(aws cloudformation describe-stacks \
            --stack-name "$STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaFunctionName'].OutputValue" \
            --output text 2>/dev/null || echo "")

          if [ -z "$FUNCTION" ]; then
            echo "running=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "running=true" >> $GITHUB_OUTPUT
          echo "function=$FUNCTION" >> $GITHUB_OUTPUT

      - name: Check Lambda invocations in last 60 minutes
        id: traffic
        if: steps.check.outputs.running == 'true'
        run: |
          END_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          START_TIME=$(date -u -d '60 minutes ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null \
            || date -u -v-60M +%Y-%m-%dT%H:%M:%SZ)  # macOS fallback

          INVOCATION_COUNT=$(aws cloudwatch get-metric-statistics \
            --namespace AWS/Lambda \
            --metric-name Invocations \
            --dimensions Name=FunctionName,Value="${{ steps.check.outputs.function }}" \
            --start-time "$START_TIME" \
            --end-time "$END_TIME" \
            --period 3600 \
            --statistics Sum \
            --query "Datapoints[0].Sum" \
            --output text)

          echo "Invocation count in last 60 min: $INVOCATION_COUNT"

          if [ "$INVOCATION_COUNT" = "None" ] || [ "$INVOCATION_COUNT" = "0.0" ] || [ -z "$INVOCATION_COUNT" ]; then
            echo "idle=true" >> $GITHUB_OUTPUT
          else
            echo "idle=false" >> $GITHUB_OUTPUT
          fi

      - name: Stop idle RDS
        if: steps.check.outputs.running == 'true' && steps.traffic.outputs.idle == 'true'
        run: |
          echo "No Lambda invocations in 60 minutes — stopping prod RDS"

          STACK="FastSpec-Data-prod"
          INSTANCE_ID=$(aws rds describe-db-instances \
            --query "DBInstances[?TagList[?Key=='aws:cloudformation:stack-name'&&Value=='$STACK']].DBInstanceIdentifier" \
            --output text)

          STATUS=$(aws rds describe-db-instances \
            --db-instance-identifier "$INSTANCE_ID" \
            --query "DBInstances[0].DBInstanceStatus" \
            --output text)

          if [ "$STATUS" = "available" ]; then
            aws rds stop-db-instance --db-instance-identifier "$INSTANCE_ID"
            echo "RDS stopped"
          fi

          echo "Prod environment stopped due to inactivity"

      - name: Environment still active
        if: steps.check.outputs.running == 'true' && steps.traffic.outputs.idle == 'false'
        run: echo "Lambda invocations detected in last 60 min — keeping RDS running"

      - name: Environment already stopped
        if: steps.check.outputs.running == 'false'
        run: echo "Lambda stack not found — nothing to do"
