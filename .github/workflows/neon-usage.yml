name: Database usage

# The hosted version's database is on Neon's free plan (docs/adr/0009-*.md),
# which sends no warning before an allowance runs out: the database is then
# suspended until the next month, or refuses writes once storage is full.
# Every day this:
#   - warns when storage passes 80% of its limit (from Neon's API);
#   - checks that the app can reach its database. Neon's API doesn't report
#     compute or transfer usage on the free plan, so running out of those is
#     caught here, the day it happens (FastSpec answers
#     "database_quota_exceeded"). The check wakes the database for about five
#     minutes, some 0.6 of the month's 100 compute-hours.
# A failed scheduled run makes GitHub email whoever last changed the schedule.
#
# Secrets: NEON_API_KEY (an API key limited to the FastSpec project) and
# NEON_PROJECT_ID; variable: FASTSPEC_DOMAIN. See docs/DEPLOYMENT.md.

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Storage against the free plan's limit
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: |
          python3 - <<'EOF'
          import json, os, sys, urllib.request

          request = urllib.request.Request(
              f"https://console.neon.tech/api/v2/projects/{os.environ['NEON_PROJECT_ID']}",
              headers={"Authorization": f"Bearer {os.environ['NEON_API_KEY']}", "Accept": "application/json"},
          )
          project = json.load(urllib.request.urlopen(request, timeout=30))["project"]
          used = project["synthetic_storage_size"]
          limit = project["branch_logical_size_limit_bytes"]
          print(f"storage: {used / 2**20:.1f} of {limit / 2**20:.0f} MB ({used / limit:.0%})")
          if used >= 0.8 * limit:
              print("::error::Database storage above 80% of the free plan's limit. See docs/DEPLOYMENT.md, 'Database allowance'.")
              sys.exit(1)
          EOF

      - name: The app can reach its database
        if: ${{ !cancelled() }}
        env:
          URL: https://${{ vars.FASTSPEC_DOMAIN }}/api/health/ready
        run: |
          python3 - <<'EOF'
          import json, os, sys, urllib.error, urllib.request

          try:
              with urllib.request.urlopen(os.environ["URL"], timeout=60) as response:
                  body = json.load(response)
          except urllib.error.HTTPError as error:
              body = json.load(error) if error.headers.get_content_type() == "application/json" else {}
              body.setdefault("detail", f"HTTP {error.code}")
          print(f"readiness: {body}")
          if body.get("status") == "ready":
              sys.exit(0)
          if body.get("code") == "database_quota_exceeded":
              print("::error::Neon's free-plan allowance is used up: the database is suspended until next month. See docs/DEPLOYMENT.md, 'Database allowance'.")
          else:
              print(f"::error::The app can't reach its database: {body.get('detail')}")
          sys.exit(1)
          EOF
