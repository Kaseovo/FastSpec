name: Database usage

# The hosted version's database is on Neon's free plan (docs/adr/0009-*.md),
# which sends no warning before an allowance runs out: then the database is
# suspended until the next month, or refuses writes once storage is full.
# This checks usage weekly and fails above 80% — GitHub emails whoever last
# changed this schedule when a scheduled run fails.
#
# Secrets: NEON_API_KEY (an API key limited to the FastSpec project) and
# NEON_PROJECT_ID. See docs/DEPLOYMENT.md.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Compare usage with the free plan's allowances
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: |
          python3 - <<'EOF'
          import json, os, sys, urllib.request

          # Neon free plan (neon.com/pricing): compute and data transfer per
          # month, storage in total. field → (limit, unit, unit size)
          LIMITS = {
              "compute_time_seconds": (100 * 3600, "CU-hours", 3600),
              "synthetic_storage_size": (512 * 1024**2, "MB storage", 1024**2),
              "data_transfer_bytes": (5 * 1024**3, "GB transfer", 1024**3),
          }
          WARN_AT = 0.8

          request = urllib.request.Request(
              f"https://console.neon.tech/api/v2/projects/{os.environ['NEON_PROJECT_ID']}",
              headers={"Authorization": f"Bearer {os.environ['NEON_API_KEY']}", "Accept": "application/json"},
          )
          project = json.load(urllib.request.urlopen(request, timeout=30))["project"]

          over = []
          for field, (limit, unit, size) in LIMITS.items():
              used = project.get(field) or 0
              print(f"{used / size:8.1f} of {limit / size:.0f} {unit} ({used / limit:.0%})")
              if used >= WARN_AT * limit:
                  over.append(unit)
          print(f"period: {project['consumption_period_start']} to {project['consumption_period_end']}")
          if over:
              print(f"::error::Neon free plan above {WARN_AT:.0%}: {', '.join(over)}. See docs/DEPLOYMENT.md, 'Database allowance'.")
              sys.exit(1)
          EOF
