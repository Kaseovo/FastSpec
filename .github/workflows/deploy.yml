name: Deploy to AWS

# Deploys `main` to the AWS serverless setup (the deploy role only trusts
# main — docs/DEPLOYMENT.md). Releases (version bump, tag, Docker image)
# are a separate workflow: release.yml.

on:
  workflow_dispatch:
    inputs:
      env:
        description: 'Deployment environment'
        required: false
        default: 'prod'
        type: choice
        options:
          - prod

# Deployment-specific values come from GitHub repository variables
# (Settings → Secrets and variables → Actions → Variables), never the code:
#   FASTSPEC_DOMAIN   public domain, e.g. fastspec.example.com
#   HOSTED_ZONE_ID    Route 53 hosted zone that holds it
#   HOSTED_ZONE_NAME  optional — only when that zone is a parent (e.g. example.com)
#   AWS_REGION        region for everything but the CloudFront certificate
# Secrets: AWS_ROLE_ARN (OIDC deploy role), WAKE_SECRET. See docs/DEPLOYMENT.md.
env:
  FASTSPEC_DOMAIN: ${{ vars.FASTSPEC_DOMAIN }}
  HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}
  HOSTED_ZONE_NAME: ${{ vars.HOSTED_ZONE_NAME }}

jobs:
  # ── Validate (tests + cdk synth) — must pass before anything is deployed ───
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        # The same ref is deployed below, so what ships is what was validated.
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Backend tests
        run: |
          pip install -r backend/requirements-dev.txt
          cd backend && python -m pytest tests --tb=short

      - name: Frontend tests
        run: cd frontend && npm ci && npm test

      - name: Infra tests + cdk synth
        run: |
          cd infra && npm ci
          npm test
          npx cdk synth --context env=${{ github.event.inputs.env }} \
            --context certificateArn=arn:aws:acm:us-east-1:000000000000:certificate/placeholder \
            >/dev/null

  # ── Deploy (only after validate passes) ─────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: [validate]
    permissions:
      contents: read
      id-token: write   # required for OIDC

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── AWS credentials (OIDC) ────────────────────────────────────────────────

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # ── CDK diff + deploy ────────────────────────────────────────────────────

      - name: Install CDK dependencies
        run: npm ci
        working-directory: infra

      - name: cdk diff (DataStack, informational)
        run: npx cdk diff FastSpec-Data-${{ github.event.inputs.env }} --context env=${{ github.event.inputs.env }} || true
        working-directory: infra

      - name: Deploy DataStack
        run: npx cdk deploy FastSpec-Data-${{ github.event.inputs.env }} --context env=${{ github.event.inputs.env }} --require-approval never
        working-directory: infra

      - name: cdk diff (LambdaStack, informational)
        run: npx cdk diff FastSpec-Lambda-${{ github.event.inputs.env }} --context env=${{ github.event.inputs.env }} || true
        working-directory: infra

      - name: Deploy LambdaStack
        run: npx cdk deploy FastSpec-Lambda-${{ github.event.inputs.env }} --context env=${{ github.event.inputs.env }} --require-approval never
        working-directory: infra

      # ── Migration ─────────────────────────────────────────────────────────────

      - name: Run database migration
        run: |
          ENV=${{ github.event.inputs.env }}
          STACK="FastSpec-Lambda-${ENV}"

          FUNCTION=$(aws cloudformation describe-stacks \
            --stack-name "$STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaFunctionName'].OutputValue" \
            --output text)

          aws lambda invoke \
            --function-name "$FUNCTION" \
            --payload '{"migrate": true}' \
            --cli-binary-format raw-in-base64-out \
            response.json

          STATUS=$(python3 -c "import json; print(json.load(open('response.json')).get('statusCode', 500))")
          echo "Migration status: $STATUS"
          [ "$STATUS" = "200" ] || exit 1

      # ── FrontendStack + S3 sync ───────────────────────────────────────────────

      - name: Deploy CertStack
        run: npx cdk deploy FastSpec-Cert-${{ github.event.inputs.env }} --context env=${{ github.event.inputs.env }} --require-approval never
        working-directory: infra

      - name: Read certificate ARN from CertStack output
        id: cert
        run: |
          ARN=$(aws cloudformation describe-stacks \
            --stack-name FastSpec-Cert-${{ github.event.inputs.env }} \
            --region us-east-1 \
            --query "Stacks[0].Outputs[?OutputKey=='CertificateArn'].OutputValue" \
            --output text)
          echo "arn=$ARN" >> $GITHUB_OUTPUT

      - name: cdk diff (FrontendStack, informational)
        run: npx cdk diff FastSpec-Frontend-${{ github.event.inputs.env }} --context env=${{ github.event.inputs.env }} --context certificateArn=${{ steps.cert.outputs.arn }} --context deployId=${{ github.run_number }} || true
        working-directory: infra

      - name: Deploy FrontendStack
        run: npx cdk deploy FastSpec-Frontend-${{ github.event.inputs.env }} --context env=${{ github.event.inputs.env }} --context certificateArn=${{ steps.cert.outputs.arn }} --context deployId=${{ github.run_number }} --require-approval never
        working-directory: infra

      - name: Deploy WakeStack
        run: npx cdk deploy FastSpec-Wake-${{ github.event.inputs.env }} --context env=${{ github.event.inputs.env }} --require-approval never
        working-directory: infra

      - name: Get S3 bucket names, CloudFront distribution ID and Wake URL
        id: infra_outputs
        run: |
          ENV=${{ github.event.inputs.env }}
          FRONTEND_STACK="FastSpec-Frontend-${ENV}"
          WAKE_STACK="FastSpec-Wake-${ENV}"

          FRONTEND_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "$FRONTEND_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='FrontendBucketName'].OutputValue" \
            --output text)

          LANDING_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "$FRONTEND_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='LandingBucketName'].OutputValue" \
            --output text)

          DISTRIBUTION_ID=$(aws cloudformation describe-stacks \
            --stack-name "$FRONTEND_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" \
            --output text)

          WAKE_URL=$(aws cloudformation describe-stacks \
            --stack-name "$WAKE_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='WakeFunctionUrl'].OutputValue" \
            --output text)

          echo "frontend_bucket=$FRONTEND_BUCKET" >> $GITHUB_OUTPUT
          echo "landing_bucket=$LANDING_BUCKET" >> $GITHUB_OUTPUT
          echo "distribution_id=$DISTRIBUTION_ID" >> $GITHUB_OUTPUT
          echo "wake_url=$WAKE_URL" >> $GITHUB_OUTPUT

      - name: Build frontend SPA
        run: npm ci && npm run build
        working-directory: frontend

      - name: Sync frontend SPA to S3
        run: |
          aws s3 sync frontend/dist/ s3://${{ steps.infra_outputs.outputs.frontend_bucket }}/ --delete

      - name: Publish the wake page
        # The landing site is deployed from its own repository; its sync
        # excludes wake.html so it never removes this page.
        env:
          WAKE_URL: ${{ steps.infra_outputs.outputs.wake_url }}
          WAKE_SECRET: ${{ secrets.WAKE_SECRET }}
        run: |
          sed -e "s|__WAKE_URL__|${WAKE_URL}|g" -e "s|__WAKE_SECRET__|${WAKE_SECRET}|g" \
            infra/wake-page/wake.html > wake.html
          aws s3 cp wake.html s3://${{ steps.infra_outputs.outputs.landing_bucket }}/wake.html \
            --content-type "text/html; charset=utf-8" --cache-control "no-cache"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.infra_outputs.outputs.distribution_id }} \
            --paths "/*"
