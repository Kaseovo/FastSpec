services:
  backend:
    image: python:3.11-slim
    container_name: fastspec-backend-dev
    working_dir: /app
    command: >
      bash -c "pip install --no-cache-dir -r requirements.txt &&
               python main.py"
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - fastspec-network

  frontend:
    image: node:20-alpine
    container_name: fastspec-frontend-dev
    working_dir: /app
    command: >
      sh -c "npm install --legacy-peer-deps &&
             npm run dev"
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - fastspec-network

networks:
  fastspec-network:
    driver: bridge
