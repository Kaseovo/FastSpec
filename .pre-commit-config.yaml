# Pre-commit hooks for FastSpec.
#
# Install once per clone:
#   pip install pre-commit && pre-commit install
#
# Scope note: ruff targets backend/ (Python), prettier targets frontend/ and
# top-level docs/config (JS/Vue/JSON/Markdown), detect-secrets scans the
# whole repo. Kept deliberately small — see docs/CODE_REVIEW.md §9.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        name: ruff (lint) — backend
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        name: ruff (format) — backend
        files: ^backend/

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.3.3
    hooks:
      - id: prettier
        name: prettier — frontend
        files: ^frontend/.*\.(js|jsx|ts|tsx|vue|css|json)$
        exclude: ^frontend/(dist|node_modules)/

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: package-lock\.json$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1000']
