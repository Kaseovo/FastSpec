[bumpversion]
current_version = 0.0.24
commit = True
tag = True

[bumpversion:file:backend/version.py]
search = __version__ = '{current_version}'
replace = __version__ = '{new_version}'

[bumpversion:file:frontend/.env.version]
search = REACT_APP_VERSION={current_version}
replace = REACT_APP_VERSION={new_version}
